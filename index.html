<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181D">
<title>Barkod Masası</title>
<style>
:root{
  --graphite:#16181D; --panel:#1F232B; --line:#2E343F;
  --yellow:#F2C200; --mute:#8A93A3;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--graphite);color:#EDEFF3;font-family:var(--ui)}
body{display:flex;align-items:center;justify-content:center;padding:24px}
.card{max-width:360px;width:100%;text-align:center}
.bars{display:flex;gap:3px;height:44px;align-items:flex-end;justify-content:center;margin-bottom:22px}
.bars i{display:block;width:3px;background:var(--yellow);border-radius:1px}
h1{font-size:14px;letter-spacing:.2em;text-transform:uppercase;margin:0 0 18px;font-weight:700}
h1 span{color:var(--yellow)}
p{font-size:15px;line-height:1.65;color:#C7CDD9;margin:0 0 14px}
.note{margin-top:26px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  font-family:var(--mono);font-size:12px;line-height:1.7;color:var(--mute)}
footer{margin-top:22px;font-family:var(--mono);font-size:10.5px;color:#5C6474}
</style>
</head>
<body>
<div class="card">
  <div class="bars" id="bars" aria-hidden="true"></div>
  <h1>Barkod<span>·</span>Masası</h1>
  <p>Bu araç artık bir <strong>iPhone uygulaması</strong> olarak çalışıyor.</p>
  <p>Web sürümü kapatıldı.</p>
  <div class="note">
    Erişim davetle veriliyor.<br>
    Uygulamayı kullanmanız gerekiyorsa<br>
    lütfen bana ulaşın.
  </div>
  <footer>Mağaza içi kullanım · özel araç</footer>
</div>
<script>
const b=document.getElementById("bars");
[18,34,12,40,22,9,30,16,44,13,26,36,10,24,32,15].forEach(h=>{
  const i=document.createElement("i"); i.style.height=h+"px"; b.appendChild(i);
});
</script>
</body>
</html>
