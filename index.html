<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#16181D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Barkod">
<title>Barkod Masası</title>
<style>
:root{
  --graphite:#16181D; --panel:#1F232B; --line:#2E343F;
  --yellow:#F2C200; --mute:#8A93A3; --red:#FF6B6B;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--graphite);color:#EDEFF3;font-family:var(--ui);-webkit-text-size-adjust:100%}
body{padding:0 12px calc(10px + env(safe-area-inset-bottom));max-width:460px;margin:0 auto}

header{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 2px 8px}
header h1{font-size:12px;letter-spacing:.18em;text-transform:uppercase;margin:0;font-weight:700}
header h1 span{color:var(--yellow)}
header .sub{font-family:var(--mono);font-size:10px;color:var(--mute);margin-left:auto}

.paper{background:#fff;border-radius:12px;padding:10px 8px 6px;position:relative;overflow:hidden}
.paper svg{display:block;width:100%;height:auto}
.paper.empty{display:flex;align-items:center;justify-content:center;min-height:96px;text-align:center;padding:14px}
.paper.empty p{color:#7A8090;font-size:12.5px;line-height:1.45;margin:0;max-width:230px}
.paper .stamp{position:absolute;top:7px;right:9px;font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:#BCC2CE}
.wrap{position:relative}
.expand{position:absolute;right:8px;bottom:7px;background:#000;color:#fff;border:0;border-radius:7px;
  font-family:var(--mono);font-size:10px;padding:6px 9px;letter-spacing:.05em}

.readout{margin:8px 0 0;padding:9px 11px;background:var(--panel);border:1px solid var(--line);border-radius:11px}
.readout .digits{font-family:var(--mono);font-size:20px;letter-spacing:.04em;font-weight:700;min-height:25px;word-break:break-all}
.readout .digits .check{color:var(--yellow)}
.readout .digits .caret{display:inline-block;width:2px;height:19px;background:var(--yellow);vertical-align:-3px;animation:blink 1.1s steps(1,end) infinite}
@keyframes blink{50%{opacity:0}}
.readout .status{display:flex;justify-content:space-between;gap:8px;margin-top:5px;font-family:var(--mono);font-size:10.5px;color:var(--mute)}
.readout .status .bad{color:var(--red)}
.readout .status .ok{color:var(--yellow)}

.row{display:flex;gap:7px;margin-top:8px}
button{font-family:var(--ui);font-size:14px;font-weight:500;border-radius:10px;padding:11px;background:var(--panel);
  color:#EDEFF3;border:1px solid var(--line);flex:1;cursor:pointer}
button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
button.primary{background:var(--yellow);color:#101216;border-color:var(--yellow);font-weight:700}
button.ghost{background:transparent}
button[disabled]{opacity:.35}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
.pad button{font-family:var(--mono);font-size:20px;font-weight:700;padding:11px 0}
.pad button.fn{font-size:11px;font-family:var(--ui);font-weight:500;color:var(--mute)}

.seg{display:flex;gap:6px;margin-top:8px}
.seg button{font-family:var(--mono);font-size:10.5px;padding:7px 4px;letter-spacing:.05em}
.seg button[aria-pressed="true"]{background:#2B313C;color:var(--yellow);border-color:var(--yellow)}

.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.chips button{flex:0 0 auto;font-family:var(--mono);font-size:11px;padding:7px 9px;color:#C7CDD9}
.chips:empty{display:none}

#scanner{position:fixed;inset:0;background:#000;z-index:50;display:none}
#scanner.on{display:block}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.reticle{position:absolute;left:6%;right:6%;top:44%;transform:translateY(-50%);height:140px;
  border:2px solid var(--yellow);border-radius:10px;box-shadow:0 0 0 100vmax rgba(0,0,0,.5);pointer-events:none}
.reticle .laser{position:absolute;left:0;right:0;top:50%;height:2px;background:var(--yellow);opacity:.9;animation:sweep 2s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:translateY(-54px)}50%{transform:translateY(54px)}}
@media (prefers-reduced-motion:reduce){.laser{animation:none}.caret{animation:none}}
.scan-ui{position:absolute;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));padding:0 16px;text-align:center}
.scan-ui p{font-family:var(--mono);font-size:11.5px;color:#D6DBE4;margin:0 0 10px;line-height:1.5}
.scan-ui .btns{display:flex;gap:7px;max-width:320px;margin:0 auto}
.scan-err{position:absolute;left:14px;right:14px;top:calc(16px + env(safe-area-inset-top));background:#241A1A;border:1px solid #5A2C2C;
  color:#FFD8D8;font-size:12.5px;line-height:1.55;padding:11px 13px;border-radius:10px;display:none;max-height:60vh;overflow:auto}
.scan-err code{font-family:var(--mono);font-size:11px;color:#FFB4B4}

#big{position:fixed;inset:0;background:#fff;z-index:60;display:none;align-items:center;justify-content:center;padding:14px}
#big.on{display:flex}
#bigHolder{width:100%;display:flex;align-items:center;justify-content:center}
#bigHolder svg{width:100%;height:auto}
#bigHolder svg.rot{transform:rotate(90deg);width:88vh;max-width:none}
#big .close,#big .turn{position:absolute;background:#000;color:#fff;border:0;border-radius:8px;padding:8px 11px;
  font-family:var(--mono);font-size:11px;flex:0 0 auto}
#big .close{top:calc(12px + env(safe-area-inset-top));right:12px}
#big .turn{bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%)}

footer{margin-top:10px;font-family:var(--mono);font-size:9.5px;color:#5C6474;line-height:1.6;text-align:center}
@media (max-height:700px){footer{display:none}}
@media print{
  body>*{display:none!important}
  body{padding:0}
  .wrap{display:block!important}
  .wrap .expand{display:none!important}
  .paper{border:0;padding:0}
}
</style>
</head>
<body>

<header>
  <h1>Barkod<span>·</span>Masası</h1>
  <div class="sub" id="typeTag">EAN-13</div>
</header>

<div class="wrap">
  <div class="paper empty" id="paper"><p>Kod yok. Kamerayı açın, fotoğraf çekin ya da rakamları tuşlayın.</p></div>
  <button class="expand" id="btnBig" style="display:none">TAM EKRAN</button>
</div>

<div class="readout">
  <div class="digits" id="digits"><span class="caret"></span></div>
  <div class="status"><span id="lenInfo">0 / 13 hane</span><span id="checkInfo"></span></div>
  <div id="rawRead" style="display:none;margin-top:7px;padding-top:7px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:var(--yellow);word-break:break-all"></div>
</div>

<div class="row">
  <button class="primary" id="btnScan">Kamerayı aç</button>
  <button class="ghost" id="btnPhoto">Fotoğraftan oku</button>
</div>
<input type="file" id="fileIn" accept="image/*" capture="environment" style="position:absolute;left:-9999px">

<div class="seg">
  <button id="segAuto" aria-pressed="true">OTOMATİK</button>
  <button id="seg13" aria-pressed="false">EAN-13</button>
  <button id="seg8" aria-pressed="false">EAN-8</button>
  <button id="btnPrint" disabled>YAZDIR</button>
</div>

<div class="pad" id="pad">
  <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
  <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
  <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
  <button class="fn" data-k="clear">TEMİZLE</button>
  <button data-k="0">0</button>
  <button class="fn" data-k="del">SİL &#9003;</button>
</div>

<div class="chips" id="chips"></div>

<footer>868 / 869 = Turkiye GS1 on eki &middot; 12 hane girerseniz 13. hane otomatik</footer>

<div id="scanner">
  <video id="cam" playsinline muted autoplay></video>
  <div class="reticle" id="reticle"><div class="laser"></div></div>
  <div class="scan-err" id="scanErr"></div>
  <div class="scan-ui">
    <p id="scanMsg">Kamera aciliyor...</p>
    <div class="btns">
      <button id="btnPhoto2" class="ghost" style="color:#fff;border-color:#555">Fotoğraf çek</button>
      <button id="btnStop">Kapat</button>
    </div>
  </div>
</div>

<div id="big">
  <button class="close" id="bigClose">KAPAT</button>
  <div id="bigHolder"></div>
  <button class="turn" id="bigTurn">ÇEVİR</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
/* ---------- EAN kodlama ---------- */
const L=["0001101","0011001","0010011","0111101","0100011","0110001","0101111","0111011","0110111","0001011"];
const G=["0100111","0110011","0011011","0100001","0011101","0111001","0000101","0010001","0001001","0010111"];
const R=["1110010","1100110","1101100","1000010","1011100","1001110","1010000","1000100","1001000","1110100"];
const PARITY=["LLLLLL","LLGLGG","LLGGLG","LLGGGL","LGLLGG","LGGLLG","LGGGLL","LGLGLG","LGLGGL","LGGLGL"];
function checkDigit(b){const d=b.split("").map(Number).reverse();let s=0;d.forEach((n,i)=>{s+=n*(i%2===0?3:1)});return (10-(s%10))%10}
function ean13Bits(c){const p=PARITY[+c[0]];let s="101";for(let i=0;i<6;i++){const d=+c[1+i];s+=(p[i]==="L"?L[d]:G[d])}s+="01010";for(let i=0;i<6;i++)s+=R[+c[7+i]];return s+"101"}
function ean8Bits(c){let s="101";for(let i=0;i<4;i++)s+=L[+c[i]];s+="01010";for(let i=0;i<4;i++)s+=R[+c[4+i]];return s+"101"}

function renderSVG(code,type,tall){
  const e13=type==="EAN13";
  const bits=e13?ean13Bits(code):ean8Bits(code);
  const qL=e13?11:7,qR=7,total=qL+bits.length+qR;
  const BH=tall?70:34, EXT=tall?5:3, TXT=BH+EXT+9, H=TXT+3;
  const guards=e13?[[0,2],[45,49],[92,94]]:[[0,2],[31,35],[64,66]];
  const isG=i=>guards.some(g=>i>=g[0]&&i<=g[1]);
  let rects="",i=0;
  while(i<bits.length){
    if(bits[i]==="0"){i++;continue}
    const t=isG(i);let j=i;
    while(j<bits.length&&bits[j]==="1"&&isG(j)===t)j++;
    rects+='<rect x="'+(qL+i)+'" y="0" width="'+(j-i)+'" height="'+(t?BH+EXT:BH)+'"/>';
    i=j;
  }
  const tx=[];
  const put=(v,cx)=>tx.push('<text x="'+cx+'" y="'+TXT+'" font-size="9" text-anchor="middle" font-family="monospace" letter-spacing="0.4">'+v+'</text>');
  if(e13){
    put(code[0],qL-5.5);
    for(let k=0;k<6;k++)put(code[1+k],qL+3+7*k+3.5);
    for(let k=0;k<6;k++)put(code[7+k],qL+50+7*k+3.5);
  }else{
    for(let k=0;k<4;k++)put(code[k],qL+3+7*k+3.5);
    for(let k=0;k<4;k++)put(code[4+k],qL+36+7*k+3.5);
  }
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+total+' '+H+'" shape-rendering="crispEdges" fill="#000">'+rects+tx.join("")+'</svg>';
}

/* ---------- durum ---------- */
const S={raw:"",mode:"auto",hist:[],rot:false};
const $=id=>document.getElementById(id);
const autoType=()=>S.mode==="e8"?"EAN8":"EAN13";
const maxLen=()=>autoType()==="EAN8"?8:13;

function render(){
  const type=autoType(),need=maxLen();
  $("typeTag").textContent=type==="EAN8"?"EAN-8":"EAN-13";
  let html;
  if(!S.raw.length)html='<span class="caret"></span>';
  else if(S.raw.length===need-1)html=S.raw+'<span class="check">'+checkDigit(S.raw)+'</span>';
  else html=S.raw;
  $("digits").innerHTML=html;
  $("lenInfo").textContent=S.raw.length+" / "+need+" hane";
  let full=null,note="";
  if(S.raw.length===need-1){full=S.raw+checkDigit(S.raw);note='<span class="ok">kontrol hanesi eklendi</span>'}
  else if(S.raw.length===need){
    const c=checkDigit(S.raw.slice(0,need-1));
    if(c===+S.raw[need-1]){full=S.raw;note='<span class="ok">kontrol hanesi dogru</span>'}
    else note='<span class="bad">hatali &rarr; '+c+' olmali</span>';
  }else if(S.raw.length)note=(need-S.raw.length)+" hane eksik";
  $("checkInfo").innerHTML=note;
  const p=$("paper");
  if(full){
    p.classList.remove("empty");
    p.innerHTML='<div class="stamp">'+(type==="EAN8"?"EAN-8":"EAN-13")+'</div>'+renderSVG(full,type,false);
    $("btnBig").style.display="block";$("btnPrint").disabled=false;
  }else{
    p.classList.add("empty");
    p.innerHTML="<p>"+(S.raw.length?("Barkod icin "+(need-S.raw.length)+" hane daha."):"Kod yok. Kamerayı açın, fotoğraf çekin ya da rakamları tuşlayın.")+"</p>";
    $("btnBig").style.display="none";$("btnPrint").disabled=true;
  }
  return full;
}
$("pad").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const k=b.dataset.k;
  if(k==="clear")S.raw="";else if(k==="del")S.raw=S.raw.slice(0,-1);
  else if(S.raw.length<maxLen())S.raw+=k;
  render();
});
document.addEventListener("keydown",e=>{
  if(/^[0-9]$/.test(e.key)&&S.raw.length<maxLen()){S.raw+=e.key;render()}
  else if(e.key==="Backspace"){S.raw=S.raw.slice(0,-1);render()}
});
function setMode(m){
  S.mode=m;
  $("segAuto").setAttribute("aria-pressed",m==="auto");
  $("seg13").setAttribute("aria-pressed",m==="e13");
  $("seg8").setAttribute("aria-pressed",m==="e8");
  if(S.raw.length>maxLen())S.raw=S.raw.slice(0,maxLen());
  render();
}
$("segAuto").onclick=()=>setMode("auto");
$("seg13").onclick=()=>setMode("e13");
$("seg8").onclick=()=>setMode("e8");
function pushHist(c){
  S.hist=[c,...S.hist.filter(x=>x!==c)].slice(0,10);
  $("chips").innerHTML=S.hist.map(x=>'<button data-c="'+x+'">'+x+'</button>').join("");
}
$("chips").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  accept(b.dataset.c,"");
});
$("btnBig").onclick=()=>{
  const f=render();if(!f)return;
  $("bigHolder").innerHTML=renderSVG(f,autoType(),true);
  if(S.rot)$("bigHolder").firstChild.classList.add("rot");
  $("big").classList.add("on");
};
$("bigClose").onclick=()=>$("big").classList.remove("on");
$("bigTurn").onclick=()=>{S.rot=!S.rot;$("bigHolder").firstChild.classList.toggle("rot",S.rot)};
$("btnPrint").onclick=()=>window.print();

/* ---------- okuma ---------- */
function beep(){
  try{
    const c=new (window.AudioContext||window.webkitAudioContext)();
    const o=c.createOscillator(),g=c.createGain();
    o.frequency.value=1720;o.connect(g);g.connect(c.destination);
    g.gain.setValueAtTime(.001,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.25,c.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.13);
    o.start();o.stop(c.currentTime+.14);
  }catch(e){}
  if(navigator.vibrate)navigator.vibrate(35);
}
function showRaw(txt,fmt){
  const el=$("rawRead");
  el.style.display="block";
  el.innerHTML="OKUNAN: <b>"+txt+"</b>"+(fmt?' &middot; <span style="color:var(--mute)">'+fmt+"</span>":"");
}
function accept(code,fmt){
  if(!code)return false;
  beep();
  const c0=String(code).trim();
  let c=c0;
  if(/^\d+$/.test(c)&&c.length===12)c="0"+c;           // UPC-A -> EAN-13
  if(/^\d+$/.test(c)&&(c.length===13||c.length===8)){
    S.raw=c;setMode(c.length===8?"e8":"e13");
    $("rawRead").style.display="none";
  }else{
    showRaw(c0,fmt?fmt+" - EAN degil, barkod cizilemiyor":"EAN degil");
  }
  pushHist(c0);
  return true;
}

function zxHints(){
  const h=new Map();
  h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,
    ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E,ZXing.BarcodeFormat.CODE_128,
    ZXing.BarcodeFormat.CODE_39,ZXing.BarcodeFormat.CODE_93,ZXing.BarcodeFormat.ITF,
    ZXing.BarcodeFormat.CODABAR,ZXing.BarcodeFormat.QR_CODE]);
  h.set(ZXing.DecodeHintType.TRY_HARDER,true);
  return h;
}
function scanErr(html){const e=$("scanErr");e.innerHTML=html;e.style.display="block";$("scanMsg").textContent=""}

/* neden acilmiyor - net teshis */
function whyNoCamera(){
  const p=location.protocol,secure=window.isSecureContext;
  const framed=window.self!==window.top;
  if(p==="file:")return "Dosya <b>doğrudan Safari'de</b> açılmış (file://). Bu modda hiçbir tarayıcı kamerayı vermez.<br><br><b>Çözüm:</b> dosyayı GitHub Pages / Vercel'e koyup <code>https://</code> adresinden açın. Şimdilik <b>Fotoğraftan oku</b> çalışır.";
  if(!secure)return "Sayfa güvenli bağlantıda değil (<code>"+p+"//</code>). Kamera sadece <code>https</code> üzerinde açılır.<br><br>Şimdilik <b>Fotoğraftan oku</b> çalışır.";
  if(framed)return "Uygulama bir <b>çerçeve içinde</b> (önizleme / uygulama içi tarayıcı) çalışıyor ve kamera izni bu çerçeveye verilmemiş.<br><br><b>Çözüm:</b> aynı adresi <b>Safari'de</b> açın. Ya da <b>Fotoğraftan oku</b> kullanın.";
  return null;
}

let stream=null,loopId=null,reader=null;
async function startScan(){
  $("scanner").classList.add("on");
  $("scanErr").style.display="none";
  $("scanMsg").textContent="Kamera aciliyor...";
  const why=whyNoCamera();
  if(why){scanErr(why);return}
  if(typeof ZXing==="undefined"){scanErr("Okuyucu kütüphanesi yüklenemedi (internet?). <b>Fotoğraftan oku</b> veya elle tuşlayın.");return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){scanErr("Bu tarayıcı kamera akışını desteklemiyor. <b>Fotoğraftan oku</b> kullanın.");return}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false});
  }catch(err){
    const n=err&&err.name||"Hata";
    let msg="Kamera açılamadı. <code>"+n+"</code><br><br>";
    if(n==="NotAllowedError")msg+="Safari'ye kamera izni verilmemiş. <b>Ayarlar &rsaquo; Safari &rsaquo; Kamera &rsaquo; Sor</b> yapıp sayfayı yenileyin. (Adres çubuğundaki <b>aA</b> &rsaquo; Web Sitesi Ayarları'ndan da açılır.)";
    else if(n==="NotFoundError")msg+="Kamera bulunamadı.";
    else if(n==="NotReadableError")msg+="Kamerayı başka bir uygulama kullanıyor. Diğer uygulamaları kapatıp tekrar deneyin.";
    else msg+="Sayfa https ile açık olmalı ve tarayıcıya kamera izni verilmeli.";
    msg+="<br><br>Alternatif: <b>Fotoğraf çek</b>.";
    scanErr(msg);return;
  }
  const v=$("cam");
  v.srcObject=stream;v.setAttribute("playsinline","true");
  try{await v.play()}catch(e){}
  $("scanMsg").textContent="Barkodu çerçeveye yerleştirin";
  reader=new ZXing.MultiFormatReader();
  reader.setHints(zxHints());
  const cv=document.createElement("canvas"),ctx=cv.getContext("2d",{willReadFrequently:true});
  reader=new ZXing.MultiFormatReader();reader.setHints(zxHints());
  const ret=$("reticle");
  let miss=0,wide=false;

  function grab(box){
    const vw=v.videoWidth,vh=v.videoHeight;
    const dw=v.clientWidth,dh=v.clientHeight;
    const sc=Math.max(dw/vw,dh/vh);              // object-fit: cover
    const visW=dw/sc,visH=dh/sc;
    const offX=(vw-visW)/2,offY=(vh-visH)/2;
    let sx=offX+box.left/sc, sy=offY+box.top/sc, sw=box.width/sc, sh=box.height/sc;
    if(wide){ const g=0.35; sx-=sw*g/2; sy-=sh*g/2; sw*=1+g; sh*=1+g; }  // donusumlu genis tarama
    sx=Math.max(0,sx);sy=Math.max(0,sy);
    sw=Math.min(sw,vw-sx);sh=Math.min(sh,vh-sy);
    cv.width=Math.round(sw);cv.height=Math.round(sh);
    ctx.drawImage(v,sx,sy,sw,sh,0,0,cv.width,cv.height);
  }
  function tryDecode(){
    const lum=new ZXing.HTMLCanvasElementLuminanceSource(cv);
    const bmp=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum));
    return reader.decode(bmp);
  }

  loopId=setInterval(()=>{
    if(!v.videoWidth)return;
    grab(ret.getBoundingClientRect());
    let res=null;
    try{res=tryDecode()}catch(e){}
    if(!res){ try{reader.reset()}catch(e){} }
    if(res){
      const fmt=(ZXing.BarcodeFormat[res.getBarcodeFormat()]||"").replace("_","-");
      if(accept(res.getText(),fmt)){stopScan();return}
    }
    wide=!wide;
    if(++miss===60)$("scanMsg").textContent="Telefonu 10-15 cm uzaklastirin, barkod cerceveyi doldursun";
    if(miss===180)$("scanMsg").textContent="Hala okumuyorsa: isigi artirin veya Fotograf cek";
    try{reader.reset()}catch(e){}
  },120);
}
function stopScan(){
  if(loopId){clearInterval(loopId);loopId=null}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  $("cam").srcObject=null;
  $("scanner").classList.remove("on");
}
$("btnScan").onclick=startScan;
$("btnStop").onclick=stopScan;

/* fotograftan okuma - her yerde calisir */
function pickPhoto(){$("fileIn").click()}
$("btnPhoto").onclick=pickPhoto;
$("btnPhoto2").onclick=()=>{stopScan();pickPhoto()};
$("fileIn").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const url=URL.createObjectURL(f);
  let ok=false;
  try{
    const r=new ZXing.BrowserMultiFormatReader(zxHints());
    const res=await r.decodeFromImageUrl(url);
    ok=accept(res.getText(),(ZXing.BarcodeFormat[res.getBarcodeFormat()]||'').replace('_','-'));
  }catch(err){ok=false}
  URL.revokeObjectURL(url);e.target.value="";
  if(!ok){
    $("scanner").classList.add("on");
    scanErr("Fotoğraftan okunamadı. Barkodu kadraja tam sığdırın, düz açıdan ve net çekin (parlama olmasın). Ya da rakamları elle tuşlayın.");
  }
});
render();
</script>
